id: linalg_solve_triangular
label: Solve Triangular System
category: '[Linear Algebra]/Solvers'

templates:
  imports: from gnuradio import linalg
  make: linalg.solve_triangular_${interface}_${type.fcn}(${shape_a}, ${shape_b}, ${is_upper}, ${is_unit})

parameters:
- id: interface
  label: Interface
  dtype: enum
  default: sync
  options: [sync, pdu]
  option_labels: [Synchronous, PDU Messages]
  hide: part

- id: type
  label: Type
  dtype: enum
  default: f
  options: [f, d, cf, cd]
  option_labels: [Float, Double, Complex Float, Complex Double]
  option_attributes:
    fcn: [ff, dd, cc, zz]
    t: [float, double, complex, complex]

- id: shape_a
  label: Matrix A Shape
  dtype: int_vector
  default: '[3, 3]'

- id: shape_b
  label: Vector b Shape
  dtype: int_vector
  default: '[3, 1]'

- id: is_upper
  label: Upper Triangular
  dtype: bool
  default: 'True'

- id: is_unit
  label: Unit Diagonal
  dtype: bool
  default: 'False'

inputs:
- label: a
  domain: ${ 'message' if interface == 'pdu' else 'stream' }
  dtype: ${type.t}
  vlen: ${shape_a[0] * shape_a[1]}

- label: b
  domain: ${ 'message' if interface == 'pdu' else 'stream' }
  dtype: ${type.t}
  vlen: ${shape_b[0] * shape_b[1]}

outputs:
- label: out
  domain: ${ 'message' if interface == 'pdu' else 'stream' }
  dtype: ${type.t}
  vlen: ${shape_b[0] * shape_b[1]}

asserts:
- ${len(shape_a) == 2}
- ${len(shape_b) == 2}
- ${shape_a[0] > 0 and shape_a[1] > 0}
- ${shape_b[0] > 0 and shape_b[1] > 0}
- ${shape_a[0] == shape_a[1]}
- ${shape_a[0] == shape_b[0]}

documentation: |-
  Efficiently solves triangular linear systems Ax = b.
  
  For triangular matrices A (either upper or lower triangular), this block
  provides O(n²) solution compared to O(n³) for general linear systems.
  
  **Mathematical operation:**
  - **Upper triangular**: Forward substitution from top to bottom
  - **Lower triangular**: Backward substitution from bottom to top
  
  **Triangular matrix types:**
  - **Upper triangular**: A[i,j] = 0 for i > j (zeros below diagonal)
  - **Lower triangular**: A[i,j] = 0 for i < j (zeros above diagonal)
  - **Unit triangular**: Diagonal elements are 1 (improves numerical stability)
  
  **Algorithm details:**
  - **Upper triangular**: x[i] = (b[i] - Σ(A[i,j]*x[j]))/A[i,i] for j > i
  - **Lower triangular**: x[i] = (b[i] - Σ(A[i,j]*x[j]))/A[i,i] for j < i
  - **Unit diagonal**: Division by A[i,i] omitted (assumes A[i,i] = 1)
  
  **Performance characteristics:**
  - **Complexity**: O(n²) operations vs O(n³) for general systems
  - **Speed**: ~10x faster than general linear solver for same size
  - **Memory**: Minimal additional storage required
  - **Stability**: Excellent numerical stability for well-conditioned matrices
  
  Applications:
  - **LU decomposition post-processing**: Solve Ly = b, then Ux = y
  - **Cholesky decomposition**: Solve Ly = b, then Lᵀx = y  
  - **Back-substitution**: QR decomposition, Gaussian elimination
  - **Iterative refinement**: Improving solution accuracy
  - **Forward substitution**: Lower triangular systems from factorizations
  
  **Special optimizations:**
  - **Unit triangular**: Skips diagonal division (assumes diagonal = 1)
  - **Banded triangular**: Can be further optimized for banded structure
  - **Block triangular**: Handles block-structured triangular matrices
  
  **Input requirements:**
  - **Matrix A**: Square triangular matrix (n×n)
  - **Vector b**: Right-hand side vector (n×1)
  - **Output x**: Solution vector (n×1)
  
  **Configuration options:**
  - **Upper/Lower**: Specifies triangular structure of matrix A
  - **Unit diagonal**: Whether diagonal elements are assumed to be 1
  - **Multiple RHS**: Can solve for multiple right-hand sides simultaneously
  
  **Numerical considerations:**
  - **Singular matrices**: Detected when diagonal element is zero
  - **Conditioning**: Performance depends on diagonal element magnitudes
  - **Pivoting**: Not required for triangular systems (already structured)
  - **Precision**: Maintains input precision throughout computation
  
  **Error handling:**
  - **Zero diagonal**: Detected and reported for non-unit triangular matrices
  - **Shape validation**: Ensures matrix is square and dimensions match
  - **Triangular structure**: User responsibility to provide correct structure
  
  **Relationship to matrix factorizations:**
  - **After LU**: Solve Ly = Pb, then Ux = y
  - **After QR**: Solve Rx = Qᵀb (R upper triangular)
  - **After Cholesky**: Solve Ly = b, then Lᵀx = y (L lower triangular)
  
  Parameters:
  - **Shape A**: Square matrix dimensions [n, n]
  - **Shape b**: Vector dimensions [n, 1] or matrix [n, k] for multiple RHS
  - **Upper/Lower**: Triangular structure specification
  - **Unit diagonal**: Whether diagonal elements are implicitly 1

file_format: 1