id: linalg_vector_normalize
label: Vector Normalize
category: '[Linear Algebra]'

templates:
  imports: from gnuradio import linalg
  make: linalg.vector_normalize_${interface}_${type.fcn}(${order}, ${shape})

parameters:
- id: interface
  label: Interface
  dtype: enum
  default: sync
  options: [sync, pdu]
  option_labels: [Synchronous, PDU Messages]

- id: type
  label: Type
  dtype: enum
  default: f
  options: [f, d, cf, cd]
  option_labels: [Float, Double, Complex Float, Complex Double]
  option_attributes:
    fcn: [ff, dd, cc, zz]
    t: [float, double, complex, complex]

- id: shape
  label: Vector Shape
  dtype: int_vector
  default: [3]

- id: order
  label: Norm Order
  dtype: enum
  default: '2'
  options: ['1', '2', 'inf']
  option_labels: ['L1 (Manhattan)', 'L2 (Euclidean)', 'L∞ (Maximum)']

inputs:
- domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] if len(shape) >= 1 else 1) if interface == 'sync' else 1}

outputs:
- domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] if len(shape) >= 1 else 1) if interface == 'sync' else 1}

asserts:
- ${len(shape) == 1}
- ${shape[0] > 0}

documentation: |-
  Normalizes input vectors to unit length using specified norm.

  Mathematical operation: v̂ = v / ||v||_p where p is the norm order

  Normalization types:
  - L1: v̂ = v / Σ|vᵢ|
  - L2: v̂ = v / √(Σ|vᵢ|²)  (most common)
  - L∞: v̂ = v / max|vᵢ|

  This block supports:
  - All numeric types (float, double, complex)
  - Various normalization types (L1, L2, L∞)
  - Vector input and output with same dimensions

  Use cases:
  - Unit vector creation
  - Signal preprocessing
  - Feature normalization
  - Direction extraction
  - Amplitude normalization

  Parameters:
  - Type: Data type of vector elements
  - Shape: Vector dimension [length]
  - Order: Type of norm for normalization

  **Output:**
  - Normalized vector with same dimensions as input
  - Zero vectors result in zero output (edge case handling)

  **Performance Notes:**
  - O(n) complexity where n is vector length
  - Optimized implementation using Eigen library

file_format: 1
