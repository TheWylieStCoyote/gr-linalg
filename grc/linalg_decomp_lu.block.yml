id: linalg_decomp_lu
label: LU Decomposition
category: '[Linear Algebra]/Decompositions'

templates:
  imports: from gnuradio import linalg
  make: linalg.decomp_lu_${interface}_${type.fcn}(${shape})

parameters:
- id: interface
  label: Interface
  dtype: enum
  default: sync
  options: [sync, pdu]
  option_labels: [Synchronous, PDU Messages]

- id: type
  label: Type
  dtype: enum
  default: f
  options: [f, d, cf, cd]
  option_labels: [Float, Double, Complex Float, Complex Double]
  option_attributes:
    fcn: [ff, dd, cc, zz]
    t: [float, double, complex, complex]

- id: shape
  label: Matrix Shape
  dtype: int_vector
  default: [3, 3]

inputs:
- domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] * shape[1] if len(shape) >= 2 else shape[0]) if interface == 'sync' else 1}

outputs:
- label: L
  domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] * shape[0] if len(shape) >= 2 else 1) if interface == 'sync' else 1}
- label: U
  domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] * shape[0] if len(shape) >= 2 else 1) if interface == 'sync' else 1}
- label: P
  domain: ${'stream' if interface == 'sync' else 'message'}
  dtype: ${type.t}
  vlen: ${int(shape[0] * shape[0] if len(shape) >= 2 else 1) if interface == 'sync' else 1}

asserts:
- ${len(shape) == 2}
- ${shape[0] > 0 and shape[1] > 0}
- ${shape[0] == shape[1]}

documentation: |-
  Computes the LU decomposition with partial pivoting of square matrices.

  Mathematical operation: PA = LU
  where P is permutation matrix, L is lower triangular, U is upper triangular

  LU decomposition factors a matrix into lower and upper triangular matrices,
  with partial pivoting for numerical stability. This is the foundation for
  efficient linear system solving and matrix inversion.

  This block supports:
  - All numeric types (float, double, complex)
  - Square matrices only (N×N)
  - Three outputs: L, U, and permutation matrix P

  Use cases:
  - Linear system solving (Ax = b)
  - Matrix inversion computation
  - Determinant calculation
  - Matrix rank determination
  - Numerical linear algebra algorithms

  Parameters:
  - Type: Data type of matrix elements
  - Shape: Matrix dimensions [rows, cols] (must be square)

  **Output Matrices:**
  - L: Lower triangular matrix with unit diagonal
  - U: Upper triangular matrix
  - P: Permutation matrix for pivoting

  **Mathematical Properties:**
  - PA = LU (with pivoting)
  - L[i,j] = 0 for i < j, L[i,i] = 1
  - U[i,j] = 0 for i > j
  - P is a permutation of identity matrix

  **Applications:**
  - Solve Ax = b: first solve Ly = Pb, then Ux = y
  - det(A) = det(P) × ∏U[i,i] (determinant via diagonal)
  - A⁻¹ computation via forward/backward substitution
  - Matrix rank from number of non-zero U diagonal elements

  **Performance Notes:**
  - O(n³) complexity for n×n matrix
  - Partial pivoting ensures numerical stability
  - Memory efficient implementation
  - Faster than full matrix inversion for solving systems

file_format: 1
