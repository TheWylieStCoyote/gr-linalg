id: linalg_zeros
label: Zeros Matrix
category: '[Linear Algebra]'

templates:
  imports: from gnuradio import linalg
  make: linalg.zeros_${type.fcn}(${shape})

parameters:
- id: type
  label: Type
  dtype: enum
  default: f
  options: [f, d, c, cd]
  option_labels: [Float, Double, Complex Float, Complex Double]
  option_attributes:
    fcn: [ff, dd, cc, zz]
    t: [float, double, complex, complex]

- id: shape
  label: Matrix Shape
  dtype: int_vector
  default: [3, 3]

inputs: []

outputs:
- domain: stream
  dtype: ${type.t}
  vlen: ${int(shape[0] * shape[1] if len(shape) >= 2 else shape[0])}

asserts:
- ${len(shape) == 2}
- ${shape[0] > 0 and shape[1] > 0}

documentation: |-
  Generates matrices filled with zeros.
  
  Mathematical operation: M(i,j) = 0 for all i,j
  
  A zeros matrix is filled entirely with the value 0. It serves as 
  the additive identity for matrix operations and is fundamental 
  in linear algebra.
  
  This block is a source block that continuously outputs the same 
  zeros matrix pattern.
  
  This block supports:
  - All numeric types (float, double, complex)
  - Any matrix dimensions (M×N)
  - Constant output stream
  
  Use cases:
  - Matrix initialization
  - Null space representation
  - Additive identity operations
  - Testing matrix operations
  - Padding matrices
  - Clearing/resetting signals
  
  Parameters:
  - Type: Data type of matrix elements
  - Shape: Matrix dimensions [rows, cols]
  
  **Mathematical Properties:**
  - All elements equal to 0
  - Rank = 0 (null matrix)
  - Determinant = 0 (for square matrices)
  - Sum of elements = 0
  - Matrix norm = 0
  - Additive identity: A + 0 = A
  
  **Output:**
  - Continuous stream of identical zeros matrices
  - Use head block to limit number of matrices if needed
  
  **Performance Notes:**
  - O(1) generation time - pattern is pre-computed
  - Memory efficient storage

file_format: 1
